/* ---------- Conferir pedidos do ML com o estoque (evita venda duplicada) ----------
   Para cada item de pedido pago, ligado ao produto pelo SKU:
   - "já conferida": alguma unidade já guarda o número desse pedido (mlPedido)
   - "já lançada": existe unidade vendida (sem pedido ligado) do mesmo produto, data ±1 dia e mesmo valor
                   -> só vincula o número do pedido, não cria venda
   - "nova": cria a venda dando baixa nas unidades mais antigas/de validade mais próxima */
const diasEntre = (a, b) => Math.abs((Date.parse(a) - Date.parse(b)) / 86400000);
const dataBR = iso => new Date(Date.parse(iso) - 3 * 3600e3).toISOString().slice(0, 10);

const skuNum = x => String(x ?? '').replace(/\D/g, '').replace(/^0+/, '');
/* Produtos que um anúncio do ML pode ser: o vínculo salvo (mlMapa) ou, senão, mesmo SKU (sem zeros à esquerda)
   ou SKU igual a um EAN. Kits repetem o SKU do produto base, então ficam em ordem de semelhança com o título. */
function candidatosMl(it) {
  const mapa = DB.config.mlMapa || {};
  if (it.item_id && mapa[it.item_id]) { const p = DB.produtos.find(x => x.id === mapa[it.item_id]); if (p) return [p]; }
  const sk = skuNum(it.sku);
  if (!sk) return [];
  const c = DB.produtos.filter(p => skuNum(p.sku) === sk || skuNum(p.ean) === sk || (p.eanAlt || []).some(a => skuNum(a) === sk));
  const pal = t => new Set(norm(t).split(/[^a-z0-9]+/).filter(Boolean));
  const kitN = t => norm(t).match(/kit\s*(\d+)/)?.[1] || '';
  const tit = pal(it.title);
  const pont = p => [...pal(p.nome)].filter(w => tit.has(w)).length + (kitN(p.nome) === kitN(it.title) ? 6 : (kitN(p.nome) || kitN(it.title)) ? -6 : 0);
  return c.sort((a, b) => pont(b) - pont(a));
}
/* melhor produto pelo título (palavras em comum / total de palavras), para sugerir o vínculo de anúncios sem produto */
function sugestaoTitulo(titulo) {
  const stop = new Set(['de', 'da', 'do', 'com', 'sem', 'sabor', 'em', 'e', 'cps', 'caps', 'capsulas', 'mg', 'g', 'ml', 'un', 'original', 'suplemento', 'pote', 'po', 'para']);
  const tk = t => new Set(norm(t).split(/[^a-z0-9]+/).filter(w => w && !stop.has(w)));
  const a = tk(titulo);
  let melhor = null, nota = 0;
  for (const p of DB.produtos) {
    const b = tk(p.nome), inter = [...b].filter(w => a.has(w)).length, jac = inter / ((a.size + b.size - inter) || 1);
    if (jac > nota) { nota = jac; melhor = p; }
  }
  return nota >= 0.4 ? melhor : null;
}

/* Janela de ±10 dias e valor com tolerância (max R$ 1,50 ou 4%): vendas lançadas à mão raramente têm data e preço idênticos aos do pedido. */
const JANELA_DUP = 10, tolValor = v => Math.max(1.5, 0.04 * v);
const freteUn = l => l.o.frete_vendedor != null ? Math.round(Number(l.o.frete_vendedor) / l.qtd * 100) / 100 : null;
function ehBonificacao(p) {
  if (!p) return false;
  if (p.bonificacao) return true;
  const us = DB.estoque.filter(u => u.produto === p.id);
  if (us.length) return us.every(u => norm(u.fornecedor).startsWith('bonifica'));
  return Object.values(DB.config.mlMapa || {}).includes(p.id);   // criado ao vincular um anúncio e nunca comprado
}
/* Pedido com reembolso parcial (ex.: 2 unidades, 1 devolvida): o ML mantém a quantidade original, mas o valor pago cai.
   A quantidade líquida é o valor pago ÷ preço unitário. */
const pedidoValido = o => o.status === 'paid' || o.status === 'partially_refunded';
function qtdLiquida(o, it) {
  const q = it.qty || 1;
  if (o.status !== 'partially_refunded' || (o.items || []).length !== 1 || !(it.unit_price > 0)) return q;
  const n = Math.round(Number(o.paid_amount) / it.unit_price);
  return n >= 1 && n < q ? n : q;
}
function mlAnalisar() {
  const linhas = [], usados = new Set();
  const pedidos = (ML.pedidos || []).filter(pedidoValido).sort((a, b) => a.date_created.localeCompare(b.date_created));
  for (const o of pedidos) {
    const data = dataBR(o.date_created);
    for (const it of o.items || []) {
      const qtd = qtdLiquida(o, it), cands = candidatosMl(it);
      const base = { o, it, prod: cands[0] || null, qtd, data, ids: [] };
      if (!cands.length) { linhas.push({ ...base, estado: 'semprod' }); continue; }
      const jaU = DB.estoque.filter(u => u.mlPedido === o.id);
      if (jaU.length >= qtd) { linhas.push({ ...base, prod: DB.produtos.find(p => p.id === jaU[0].produto) || cands[0], estado: 'ja' }); continue; }
      let achou = null;
      for (const p of cands) {
        const dup = DB.estoque.filter(u => u.produto === p.id && u.status === 'vendido' && !u.vendaFisica && !u.mlPedido && !usados.has(u.id)
          && u.dVenda && diasEntre(u.dVenda, data) <= JANELA_DUP && Math.abs((u.venda || 0) - it.unit_price) <= tolValor(it.unit_price))
          .sort((a, b) => diasEntre(a.dVenda, data) - diasEntre(b.dVenda, data) || Math.abs((a.venda || 0) - it.unit_price) - Math.abs((b.venda || 0) - it.unit_price));
        if (dup.length >= qtd) { achou = { p, us: dup.slice(0, qtd) }; break; }
      }
      if (achou) { achou.us.forEach(u => usados.add(u.id)); linhas.push({ ...base, prod: achou.p, estado: 'dup', ids: achou.us.map(u => u.id) }); continue; }
      let nova = null;
      for (const p of cands) {
        const livres = unidadesDisponiveis(p.id).filter(u => !usados.has(u.id));
        if (livres.length >= qtd) { nova = { p, us: livres.slice(0, qtd) }; break; }
      }
      if (nova) { nova.us.forEach(u => usados.add(u.id)); linhas.push({ ...base, prod: nova.p, estado: 'nova', ids: nova.us.map(u => u.id) }); continue; }
      linhas.push({ ...base, estado: ehBonificacao(cands[0]) ? 'bonif' : 'semestoque' });
    }
  }
  // venda lançada à mão com data/valor bem diferentes do pedido (até 30 dias e 12%): só sugere, nunca marca sozinho
  for (const l of linhas.filter(x => x.estado === 'semestoque')) {
    for (const p of candidatosMl(l.it)) {
      const u = DB.estoque.filter(x => x.produto === p.id && x.status === 'vendido' && !x.vendaFisica && !x.mlPedido && !usados.has(x.id) && x.dVenda
        && diasEntre(x.dVenda, l.data) <= 30 && Math.abs((x.venda || 0) - l.it.unit_price) <= 0.12 * l.it.unit_price)
        .sort((a, b) => diasEntre(a.dVenda, l.data) - diasEntre(b.dVenda, l.data))[0];
      if (u && l.qtd === 1) { usados.add(u.id); Object.assign(l, { estado: 'prov', prod: p, ids: [u.id], rotulo: `Provável: no site ${fdata(u.dVenda)} por ${brl(u.venda)}` }); break; }
    }
  }
  return linhas;
}

/* Aplica as linhas da conferência (venda nova, já lançada, bonificação). Usada pela tela e pela sincronização automática. */
function aplicarLinhasML(marcados) {
      let novas = 0, vinc = 0, novas_boni = 0;
      for (const l of marcados) {
        const us = DB.estoque.filter(u => l.ids.includes(u.id));
        if (l.estado === 'semestoque' || l.estado === 'bonif') {
          const novas = [];
          for (let j = 0; j < l.qtd; j++) {
            const u = { id: uid(), produto: l.prod.id, custo: 0, venda: null, taxa: null, frete: null, status: 'avenda', unid: 1, dVenda: null, validade: null, lote: null, fornecedor: 'Bonificação', nf: null, vendaFisica: null, dCompra: l.data };
            DB.estoque.push(u); novas.push(u);
          }
          adicionarNaLista('fornecedores', 'Bonificação');
          venderUnidades(novas, { venda: l.it.unit_price, taxa: l.it.unit_price ? (l.it.sale_fee || 0) / l.it.unit_price : null, frete: freteUn(l), data: l.data });
          novas.forEach(u => { u.mlPedido = l.o.id; }); novas_boni += novas.length;
        } else if (l.estado === 'nova') {
          venderUnidades(us, { venda: l.it.unit_price, taxa: l.it.unit_price ? (l.it.sale_fee || 0) / l.it.unit_price : null, frete: freteUn(l), data: l.data });
          us.forEach(u => { u.mlPedido = l.o.id; }); novas += us.length;
        } else if (l.estado === 'dup' || l.estado === 'prov') {
          // a venda já existia: liga ao pedido e passa a ter os valores reais do ML (valor, taxa, data e frete)
          for (const u of us) {
            u.mlPedido = l.o.id; u.venda = l.it.unit_price; u.dVenda = l.data;
            u.taxa = l.it.unit_price ? (l.it.sale_fee || 0) / l.it.unit_price : u.taxa;
            if (freteUn(l) != null) u.frete = freteUn(l);
          }
          vinc += us.length;
        }
      }
  return { novas, vinc, novas_boni };
}

  const h = hojeISO(), st = statsProdutos(), d30 = addDias(h, -30), v30 = {};

  const repor = listaRepor().filter(x => x.n30 > 0).map(x => [x.id, x.n30]);

  return out;
}

function mlFretesNasUnidades() {
  const por = {}; DB.estoque.forEach(u => { if (u.mlPedido) (por[u.mlPedido] = por[u.mlPedido] || []).push(u); });
  let n = 0;
  for (const o of ML.pedidos || []) {
    const us = por[o.id]; if (!us || o.frete_vendedor == null) continue;

    for (const u of us) if (u.frete == null) { u.frete = f; n++; }
  }
  return n;
}

let pollTimer = null, polling = false;
async function mlPoll() {
  if (polling || document.hidden || !sessao() || !DB?.produtos?.length || nuvemBloqueada || !ML.status?.connected || !ML.pedidos) return;
  polling = true;
  try {
    const { orders } = await mlChamar('list', { limit: 60, offset: 0 });
    const conhecidos = new Map(ML.pedidos.map(o => [o.id, o]));
    const novos = new Set(); let mudou = false;
    for (const o of orders) {
      const a = conhecidos.get(o.id);
      if (!a) { ML.pedidos.unshift(o); novos.add(o.id); mudou = true; }
      else if (a.status !== o.status || a.frete_em !== o.frete_em) { Object.assign(a, o); mudou = true; if (o.status === 'cancelled') novos.add(o.id); }
    }
    if (mudou) {
      const r = mlLancarSeguras(l => novos.has(l.o.id));
      const f = mlFretesNasUnidades();
      const n = mlNotificarPedidos(novos);
      if (r.novas + r.vinc + r.novas_boni + f + n) commit();
      recalcPendencias();
      if (['hoje', 'estoque', 'produtos'].includes(UI.view)) render();
    }
    if (!ML.pollEm || Date.now() - ML.pollEm > 300000) {
      ML.pollEm = Date.now();
      try {
        const [rl, rp] = await Promise.all([mlChamar('anuncios_list'), mlChamar('pendencias_ml').catch(() => null)]);
        const novo = rl.anuncios || [], chave = x => (x || []).map(a => `${a.item_id}|${a.preco}|${a.qtd}|${a.status}|${a.taxa_pct}`).join(';');
        const mudouAn = chave(novo) !== chave(ML.anuncios);
        if (mudouAn) { ML.anuncios = novo; const ap = aplicarAnuncios(); if (ap.mudou) commit(); }
        if (rp) ML.pendMl = rp;
        recalcPendencias();
        if (mudouAn && ['estoque', 'hoje', 'inicio'].includes(UI.view)) render();
      } catch (_) { /* função ainda sem a ação */ }

}
function iniciarPoll() {
  if (pollTimer) return;
  pollTimer = setInterval(mlPoll, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) mlPoll(); });
}

/* =========================================================
   Vendas do dia (como o resumo do Mercado Livre)
   ========================================================= */
function resumoDia(data, ateHora = 24) {
  const r = { pedidos: 0, un: 0, bruto: 0, tarifa: 0, frete: 0, canc: 0, cancV: 0, lucro: 0, lancados: 0, lista: [], horas: Array.from({ length: 24 }, () => 0), prod: {} };
  for (const o of ML.pedidos || []) {
    if (dataBR(o.date_created) !== data) continue;
    const hora = +hhmm(o.date_created).slice(0, 2); if (hora >= ateHora) continue;
    const it = o.items?.[0]; if (!it) continue; const q = qtdLiquida(o, it), v = (it.unit_price || 0) * q;
    if (o.status === 'cancelled') { r.canc++; r.cancV += v; r.lista.push({ o, it, q, v }); continue; }
    r.pedidos++; r.un += q; r.bruto += v; r.tarifa += (it.sale_fee || 0) * q; r.frete += Number(o.frete_vendedor || 0); r.horas[hora] += v;
    r.prod[it.title] = (r.prod[it.title] || { q: 0, v: 0 }); r.prod[it.title].q += q; r.prod[it.title].v += v;
    const us = DB.estoque.filter(u => u.mlPedido === o.id);
    if (us.length) { r.lancados++; r.lucro += sum(us, lucro); } else r.lucro += v - (it.sale_fee || 0) * q - Number(o.frete_vendedor || 0);
    r.lista.push({ o, it, q, v, lancado: us.length > 0 });
  }
  r.lista.sort((a, b) => b.o.date_created.localeCompare(a.o.date_created));
  return r;
}

   Publicidade (Product Ads) pela API de anúncios + cobranças da fatura do ML (tarifas, envio, parcelamento, Mercado Pago, Minha página...)
   ========================================================= */
const ehMarketing = c => c.subtipo === 'PADS' || c.marketplace === 'ESHOP' || /publicidade|campanha|cupom|an[uú]ncio|patroc/i.test(c.descricao || '');

/* publicidade e cobranças do ML: atualiza sozinho (no máximo de 6 em 6 horas), sem precisar clicar */
async function mktAuto() {
  if (ML.mktAutoRodando) return;
  let ult = 0; try { ult = +localStorage.getItem('bo_mkt_auto') || 0; } catch (_) { /* sem cache */ }
  if (Date.now() - ult < 6 * 36e5) return;
  ML.mktAutoRodando = true;
  try {
    await mktCarregar();
    const dias = (ML.mkt?.ads || []).map(a => a.dia).sort(), ultDia = dias[dias.length - 1];
    await mlChamar('ads_sync', { desde: ultDia ? addDias(ultDia, -3) : '2025-11-01', ate: hojeISO() });
    let { periodos } = await mlChamar('cobranca_periodos');
    if (ML.mkt?.cobrancas?.length) periodos = periodos.slice(0, 2);
    for (const per of periodos) {
      let off = 0;
      for (;;) {
        const r = await mlChamar('cobrancas', { key: per.key, offset: off, paginas: 4 });
        if (r.espera) { await esperar(5000); off = r.proximo; continue; }
        if (r.proximo == null) break;
        off = r.proximo;
      }
    }
    await mktCarregar();
    try { localStorage.setItem('bo_mkt_auto', String(Date.now())); } catch (_) { /* sem cache */ }
  } catch (_) { /* tenta de novo na próxima abertura */ }

}

   (últimos 14 dias, anúncio com um único produto possível) e devolve ao estoque o que o ML cancelou.
   O que for duvidoso (sem estoque, sem vínculo, provável) fica para você revisar em "Conferir com meu estoque". */
const AUTO_DIAS = 14;
async function mlAuto(opc = {}) {
  if ((ML.autoRodou && !opc.forcar) || !sessao() || !DB?.produtos?.length || nuvemBloqueada) return;
  ML.autoRodou = true;
  try {
    ML.status = await mlChamar('status');
    if (!ML.status.connected) return;
    ML.autoMsg = 'Sincronizando com o Mercado Livre...'; if (UI.view === 'config') render();
    await mlChamar('sync', { days: opc.dias || 10 });
    for (let k = 0; k < 6; k++) { const r = await mlChamar('fretes', { limite: 60 }); if (!r.restantes || !r.feitos) break; }
    try { await mlChamar('envios', { limite: 40 }); } catch (_) { /* função ainda sem a ação */ }
    ML.pedidos = await mlListarTudo();
    let ra = { mudou: 0 }; try { await mlCarregarAnuncios(); ra = aplicarAnuncios(); } catch (_) { /* função ainda sem a ação */ }
    const desde = new Date(Date.now() - (opc.janela || AUTO_DIAS) * 864e5).toISOString().slice(0, 10);
    const linhas = mlAnalisar().filter(l => l.data >= desde);
    const seguras = linhas.filter(l => ['dup', 'nova', 'bonif'].includes(l.estado) && candidatosMl(l.it).length === 1);
    const r = seguras.length ? aplicarLinhasML(seguras) : { novas: 0, vinc: 0, novas_boni: 0 };
    // fretes reais nas unidades ligadas que ainda estão sem frete
    const por = {}; DB.estoque.forEach(u => { if (u.mlPedido) (por[u.mlPedido] = por[u.mlPedido] || []).push(u); });
    let fretes = 0; const d75 = new Date(Date.now() - 75 * 864e5).toISOString();
    for (const o of ML.pedidos) {
      const us = por[o.id]; if (!us || o.frete_vendedor == null) continue;
      const f = Math.round(Number(o.frete_vendedor) / us.length * 100) / 100;
      for (const u of us) if (u.frete == null || (Math.abs(u.frete - f) > 0.01 && o.date_created > d75)) { u.frete = f; fretes++; }
    }
    // pedidos cancelados nos últimos 30 dias: a unidade volta ao estoque
    const desde30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    let devol = 0;
    for (const o of ML.pedidos) {
      if (o.status !== 'cancelled' || dataBR(o.date_created) < desde30) continue;
      const us = DB.estoque.filter(u => u.mlPedido === o.id && u.status === 'vendido');
      if (us.length) { devolverUnidades(us); us.forEach(u => { u.mlPedido = null; }); devol += us.length; }
    }
    const semDesde = !DB.config.notifDesde, novosAvisos = mlNotificarPedidos();
    const revisar = linhas.filter(l => ['semestoque', 'semprod', 'prov', 'revisar'].includes(l.estado)).length;
    const partes = [];
    if (r.novas + r.novas_boni) partes.push(`${plural(r.novas + r.novas_boni, 'venda lançada', 'vendas lançadas')}`);
    if (r.vinc) partes.push(`${r.vinc} já existente(s) alinhada(s)`);
    if (fretes) partes.push(`${plural(fretes, 'frete', 'fretes')}`);
    if (ra.mudou) partes.push(`${plural(ra.mudou, 'preço/taxa atualizado do ML', 'preços/taxas atualizados do ML')}`);
    if (devol) partes.push(`${plural(devol, 'devolução', 'devoluções')}`);
    ML.autoMsg = partes.length || revisar ? `Última sincronização: ${partes.join(', ') || 'nada novo'}${revisar ? ` · ${plural(revisar, 'pedido', 'pedidos')} para revisar` : ''}` : 'Mercado Livre em dia';
    mktAuto(); iniciarPoll(); recalcPendencias();
    if (partes.length || novosAvisos || semDesde) { commit(); }
    if (partes.length) { toast(`Mercado Livre: ${partes.join(', ')}${revisar ? ` · ${revisar} para revisar` : ''}`); }
    else if (['config', 'estoque', 'produtos', 'hoje'].includes(UI.view)) render();
  } catch (e) { ML.autoMsg = `Sincronização automática falhou: ${e.message}`; if (UI.view === 'config') render(); }
}

/* Mês a mês: o que o ML informou (pedidos pagos) contra o que o site tem lançado como venda do ML. Tem que bater. */
function mlDivergencias() {
  if (!ML.pedidos?.length) return '';
  const m = {};
  const lin = k => m[k] = m[k] || { mu: 0, mv: 0, su: 0, sv: 0 };
  for (const o of ML.pedidos) {
    if (!pedidoValido(o)) continue;
    const it = o.items?.[0]; if (!it) continue;
    const q = qtdLiquida(o, it), x = lin(dataBR(o.date_created).slice(0, 7)); x.mu += q; x.mv += (it.unit_price || 0) * q;
  }
  for (const u of DB.estoque) {
    if (u.status !== 'vendido' || u.vendaFisica || !u.dVenda) continue;
    const x = lin(u.dVenda.slice(0, 7)); x.su++; x.sv += u.venda || 0;
  }
  const todos = Object.keys(m).sort().reverse(), meses = ML.todosMeses ? todos : todos.slice(0, 6);
  const tot = meses.reduce((t, k) => t + Math.abs(m[k].su - m[k].mu), 0);
  return `<div class="sub-title" style="margin-top:16px">Conferência mês a mês: ML contra site ${tot ? `<span class="chip c-orange">${tot} unidade(s) de diferença</span>` : '<span class="chip c-green">tudo batendo</span>'}</div>
    <div class="table-wrap livre"><table><thead><tr><th>Mês</th><th class="num">ML un.</th><th class="num">Site un.</th><th class="num">Dif.</th><th class="num">ML R$</th><th class="num">Site R$</th><th class="num">Dif. R$</th></tr></thead><tbody>
    ${meses.map(k => { const x = m[k], du = x.su - x.mu, dv = x.sv - x.mv; const cls = Math.abs(du) || Math.abs(dv) > 1 ? 'neg' : '';
      return `<tr><td>${nomeMes(k)}</td><td class="num">${x.mu}</td><td class="num">${x.su}</td><td class="num ${cls}">${du}</td><td class="num">${brl(x.mv)}</td><td class="num">${brl(x.sv)}</td><td class="num ${cls}">${brl(dv)}</td></tr>`; }).join('')}
    </tbody></table></div>${todos.length > 6 ? `<button class="btn btn-sm btn-soft" style="margin-top:8px" data-action="mlTodosMeses">${ML.todosMeses ? 'Mostrar só os 6 últimos meses' : `Ver todos os ${todos.length} meses (desde ${nomeMes(todos[todos.length - 1])})`}</button>` : ''}`;
}

function criarAoDigitar(id, chave, rotulo) {

  const dica = document.createElement('div'); dica.className = 'hint'; dica.style.cssText = 'margin-top:4px;min-height:16px'; el.insertAdjacentElement('afterend', dica);

        uso[prod.id] = (uso[prod.id] || 0) + qtd;
        if (uso[prod.id] > unidadesDisponiveis(prod.id).length) return erro(`${prod.nome}: só há ${plural(unidadesDisponiveis(prod.id).length, 'unidade disponível', 'unidades disponíveis')}, e as notas pedem ${uso[prod.id]}.`);
        itens.push({ prod, qtd, venda, taxa: taxa == null ? null : taxa / 100, frete, nota: MODAL.notas[+tr.dataset.n] });
      }
      if (!itens.length) return erro('Nenhum item marcado para lançar.');
      let total = 0;
      for (const x of itens) {
        const vf = fisica ? obterVendaFisica(x.nota.cliente || 'Cliente sem nome', x.nota.data || hojeISO()) : null;
        const us = unidadesDisponiveis(x.prod.id).slice(0, x.qtd);
        venderUnidades(us, { venda: x.venda, taxa: x.taxa, frete: x.frete, data: x.nota.data || hojeISO(), vendaFisica: vf });
        us.forEach(u => { u.nfVenda = x.nota.chave || null; });
        total += us.length;
      }
      commit(`${plural(total, 'unidade vendida', 'unidades vendidas')} a partir de ${plural(new Set(itens.map(x => x.nota)).size, 'nota', 'notas')}`);
    },
  });
}

/* margem da linha = venda − taxa ML − frete − custo (mesma fórmula do lucro das vendas) */

function preencherLinhaCompra(tr) {
  const p = produtoPorLabel(tr.querySelector('.mc-prod').value);
  if (!p) return;
  const ult = DB.estoque.filter(i => i.produto === p.id).sort((a, b) => (b.dCompra || '').localeCompare(a.dCompra || ''))[0];

/* EAN: compara sem zeros à esquerda e aceita EANs alternativos; entre produtos com o mesmo EAN (kits), prefere o que não é kit */
const soEan = x => String(x || '').replace(/\D/g, '').replace(/^0+/, '');
function produtoPorEan(ean) {
  const e = soEan(ean);
  if (!e) return null;
  const c = DB.produtos.filter(p => soEan(p.ean) === e || (p.eanAlt || []).some(a => soEan(a) === e));
  return c.find(p => !/^kit\b/i.test(p.nome)) || c[0] || null;
}
const ignorarItemNota = (nome, ean) => (DB.config.ignorarNotas || []).some(k => norm(nome).includes(norm(k))) || (!!ean && (DB.config.ignorarEan || []).some(e => soEan(e) === soEan(ean)));
/* Lê o XML da NF-e (nfeProc ou NFe): fornecedor, número, data e itens com custo unitário
   (produtos + frete + seguro + outras despesas − desconto, dividido pela quantidade). */
function lerNFe(texto) {
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  const inf = doc.getElementsByTagNameNS('*', 'infNFe')[0];
  if (doc.querySelector('parsererror') || !inf) return null;
  const t = (el, tag) => el?.getElementsByTagNameNS('*', tag)[0]?.textContent.trim() || '';
  const n = (el, tag) => parseFloat(t(el, tag)) || 0;
  const ide = inf.getElementsByTagNameNS('*', 'ide')[0], emit = inf.getElementsByTagNameNS('*', 'emit')[0];
  const itens = [...inf.getElementsByTagNameNS('*', 'det')].flatMap(det => {
    const pr = det.getElementsByTagNameNS('*', 'prod')[0];
    const qtd = n(pr, 'qCom') || 1;
    const total = n(pr, 'vProd') + n(pr, 'vFrete') + n(pr, 'vSeg') + n(pr, 'vOutro') - n(pr, 'vDesc');
    const ean = [t(pr, 'cEAN'), t(pr, 'cEANTrib')].find(x => /^\d{8,14}$/.test(x)) || '';
    const base = { nome: t(pr, 'xProd'), ean, ncm: t(pr, 'NCM'), custo: total / qtd, valorUn: (n(pr, 'vProd') - n(pr, 'vDesc')) / qtd };
    // rastreabilidade (<rastro>): número do lote e validade; uma nota pode ter vários lotes no mesmo item
    const rastros = [...det.getElementsByTagNameNS('*', 'rastro')].map(r => ({ lote: t(r, 'nLote') || null, q: n(r, 'qLote'), validade: t(r, 'dVal') || null }));
    if (rastros.length > 1 && Math.abs(rastros.reduce((a, r) => a + r.q, 0) - qtd) < 0.5) {
      return rastros.map(r => ({ ...base, qtd: Math.max(1, Math.round(r.q)), lote: r.lote, validade: r.validade || t(det, 'dVal') || null }));
    }
    const r0 = rastros[0];
    return [{ ...base, qtd: Math.max(1, Math.round(qtd)), lote: r0?.lote || null, validade: r0?.validade || t(det, 'dVal') || null }];
  });
  const dest = inf.getElementsByTagNameNS('*', 'dest')[0];
  return { chave: (inf.getAttribute('Id') || '').replace(/^NFe/, ''), cliente: t(dest, 'xNome'), fornecedor: t(emit, 'xNome'), nf: t(ide, 'nNF'), data: (t(ide, 'dhEmi') || t(ide, 'dEmi')).slice(0, 10), itens };
}
function importarNFe(texto) {
  const nfe = lerNFe(texto);
  if (nfe) nfe.itens = nfe.itens.filter(i => !ignorarItemNota(i.nome, i.ean) || produtoPorEan(i.ean));
  if (!nfe || !nfe.itens.length) return erro('Este arquivo não parece o XML de uma NF-e.');
  const so = x => String(x || '').replace(/\D/g, '');
  const achar = it => produtoPorEan(it.ean) || DB.produtos.find(p => norm(p.nome) === norm(it.nome)) || null;
  const forn = DB.config.fornecedores.find(f => norm(nfe.fornecedor).includes(norm(f)) || norm(f).includes(norm(nfe.fornecedor))) || nfe.fornecedor;
  $('#mc-forn').value = forn;
  $('#mc-nf').value = nfe.nf;
  if (nfe.data) $('#mc-data').value = nfe.data;
  const sem = [];
  $('#mc-linhas').innerHTML = nfe.itens.map(() => linhaCompra()).join('');
  nfe.itens.forEach((it, i) => {
    const tr = $('#mc-linhas').children[i], prod = achar(it);
    tr.querySelector('.mc-qtd').value = it.qtd;
    tr.querySelector('.mc-custo').value = fmtIn(Math.round(it.custo * 100) / 100);
    if (it.validade) tr.querySelector('.mc-val').value = it.validade;
    if (it.lote) tr.querySelector('.mc-lote').value = it.lote;
    if (prod) { tr.querySelector('.mc-prod').value = labelProduto(prod); preencherLinhaCompra(tr); }
    else { tr.classList.add('mc-pend'); tr.querySelector('.mc-prod').placeholder = it.nome; sem.push(it); }
  });
  const jaLancada = nfe.nf && DB.estoque.some(i => i.nf === nfe.nf && norm(i.fornecedor) === norm(forn));
  $('#mc-aviso').innerHTML =
    (jaLancada ? `<div class="info" style="background:var(--yel-bg);color:#5c4700">Atenção: já existe uma compra com a NF ${esc(nfe.nf)} deste fornecedor. Confira para não lançar em duplicidade.</div>` : '') +
    (sem.length ? `<div class="info"><b>${plural(sem.length, 'item sem produto correspondente', 'itens sem produto correspondente')}</b> (linhas em vermelho). Escolha o produto na lista ou cadastre em Produtos → Novo produto e importe de novo:<br>${sem.map(it => `• ${esc(it.nome)}${it.ean ? ` · EAN ${it.ean}` : ''}${it.ncm ? ` · NCM ${it.ncm}` : ''}`).join('<br>')}</div>` : '');
  $$('#mc-linhas .mc-linha').forEach(atualizarMargemCompra);
  toast(`NF ${nfe.nf || ''} lida: ${plural(nfe.itens.length, 'item', 'itens')}${sem.length ? `, ${sem.length} sem produto` : ''}. Confira e lance.`);
}
/* ---------- Conferir várias NF-e de compra de uma vez ---------- */
const nfNum = x => String(x || '').replace(/\D/g, '').replace(/^0+/, '');
const mesmoForn = (a, b) => { a = norm(a); b = norm(b); return !!a && !!b && (a.includes(b) || b.includes(a)); };

function analisarNotasCompra(arquivos) {
  const vistas = new Set(), notas = [], invalidos = [];
  const so = x => String(x || '').replace(/\D/g, '');
  for (const a of arquivos) {
    const nfe = lerNFe(a.texto);
    if (!nfe || !nfe.itens.length) { invalidos.push(a.nome); continue; }
    const id = nfe.chave || `${nfe.fornecedor}|${nfe.nf}`;
    if (vistas.has(id)) continue;
    vistas.add(id);
    const forn = DB.config.fornecedores.find(f => mesmoForn(nfe.fornecedor, f)) || nfe.fornecedor;
    const itens = nfe.itens.map(it => ({ ...it, prod: produtoPorEan(it.ean) || DB.produtos.find(p => norm(p.nome) === norm(it.nome)) || null }))
      .filter(i => i.prod || !ignorarItemNota(i.nome, i.ean));
    const total = itens.filter(i => i.prod).reduce((t, i) => t + i.qtd, 0);
    const doMesmoNf = DB.estoque.filter(u => (nfe.chave && u.nfCompra === nfe.chave) || (nfNum(u.nf) && nfNum(u.nf) === nfNum(nfe.nf) && mesmoForn(u.fornecedor, forn)));
    const outroForn = !doMesmoNf.length && nfNum(nfe.nf) && DB.estoque.some(u => nfNum(u.nf) === nfNum(nfe.nf));
    const semProd = itens.filter(i => !i.prod);
    let estado = 'faltando';
    if (doMesmoNf.length >= total) estado = 'lancada';
    else if (doMesmoNf.length) estado = 'parcial';
    else if (outroForn) estado = 'talvez';
    else if (semProd.length) estado = 'semprod';
    notas.push({ nfe, forn, itens, total, lancadas: doMesmoNf.length, semProd, estado, valor: itens.reduce((t, i) => t + i.custo * i.qtd, 0) });
  }
  notas.sort((a, b) => (a.nfe.data || '').localeCompare(b.nfe.data || ''));
  return { notas, invalidos };
}

const NOTA_ESTADOS = {
  lancada: ['c-green', 'Já lançada', false],
  parcial: ['c-orange', 'Lançada pela metade: revise à mão', false],
  talvez: ['c-orange', 'Mesmo nº de NF em outro fornecedor: revise', false],

/* Cadastro guiado dos produtos de NF-e que não existem no site: um por vez, com confirmação de cada um. */
const acharProdutoXml = it => produtoPorEan(it.ean) || DB.produtos.find(p => norm(p.nome) === norm(it.nome)) || null;

function abrirCadastroXml(f) {

  <div class="form-grid"><div class="f full"><span class="lbl">Categorias</span><div class="chips" style="gap:8px">${DB.config.tipos.map(t => `<label class="check" style="background:#f6f6f9;padding:6px 10px;border-radius:8px"><input type="checkbox" class="pr-tipo" value="${esc(t)}"> ${esc(t)}</label>`).join('')}</div></div></div>
  <div class="form-grid">${campo('pr-ncm', 'NCM', inputTxt('pr-ncm', it.ncm))}${campo('pr-ean', 'EAN', inputTxt('pr-ean', it.ean))}</div>`;
  abrirModal({
    titulo: 'Cadastrar produto da nota', corpo, largura: 680, dados: { fluxo: f },
    rodape: `<button class="btn btn-soft" data-action="fecharModal">Parar aqui</button><button class="btn btn-soft" data-action="pularCadastro">Pular este</button><button class="btn btn-dark" data-action="confirmarModal">Cadastrar e continuar</button>`,

/* ---------- Conferência de estoque ---------- */
const CONF_LS = 'bo_conf';
function conferenciaPendente() {
  const u = DB.config.ultimaConferencia;
  return !u || (Date.now() - new Date(u + 'T12:00:00').getTime()) / 864e5 >= 6;
}
function modalConferencia() {
  const st = statsProdutos(), P = DB.produtos;
  let prog = {}; try { prog = JSON.parse(localStorage.getItem(CONF_LS) || '{}'); } catch (_) { /* sem cache */ }
  const salvarProg = () => { try { localStorage.setItem(CONF_LS, JSON.stringify(prog)); } catch (_) { /* sem cache */ } };
  const ps = P.filter(p => st[p.id].disp + st[p.id].sep > 0).sort((a, b) => (a.sku ?? 1e9) - (b.sku ?? 1e9));
  const esp = p => st[p.id].disp + st[p.id].sep;
  const linha = p => `<tr data-pid="${p.id}"><td class="num muted">${p.sku ?? '—'}</td><td class="prod"><div class="pn">${esc(p.nome)}</div><div class="hint">${esc(p.fabricante || '')}</div></td>
    <td class="num"><b>${esp(p)}</b>${st[p.id].sep ? `<div class="hint">${st[p.id].sep} separado</div>` : ''}</td>
    <td><input class="cf-n" type="number" min="0" inputmode="numeric" value="${esc(prog[p.id] ?? '')}" style="width:78px" aria-label="Contado: ${esc(p.nome)}"></td>
    <td class="cf-s"></td><td><button class="btn btn-sm btn-soft cf-ok">Confere</button></td></tr>`;
  const corpo = `<p class="muted" style="margin:0 0 10px">Conte o que está na prateleira (inclui os separados: vendidos e ainda não enviados). Aperte "Confere" quando bater ou digite a quantidade contada. O que você não preencher fica como está. O progresso fica salvo neste aparelho.</p>
    <div class="toolbar"><span id="cf-prog" class="chip"></span></div>
    <div class="table-wrap" style="max-height:56vh;overflow:auto"><table><thead><tr><th class="num">SKU</th><th>Produto</th><th class="num">Sistema</th><th>Contado</th><th></th><th></th></tr></thead><tbody id="cf-corpo">${ps.map(linha).join('')}</tbody></table></div>`;
  const atualizar = () => {
    let feitos = 0, difs = 0;
    for (const tr of $$('#cf-corpo tr')) {
      const p = P.find(x => x.id === tr.dataset.pid), v = tr.querySelector('.cf-n').value.trim(), c = tr.querySelector('.cf-s');
      if (v === '') { c.innerHTML = ''; continue; }
      feitos++;
      const d = parseInt(v, 10) - esp(p);
      if (d === 0) c.innerHTML = '<span class="chip c-green">ok</span>';
      else { difs++; c.innerHTML = `<span class="chip ${d < 0 ? 'c-red' : 'c-orange'}">${d > 0 ? '+' : ''}${d}</span>`; }
    }
    $('#cf-prog').textContent = `${feitos} de ${ps.length} conferidos · ${difs} com diferença`;
  };
  abrirModal({ titulo: 'Conferência de estoque', corpo, largura: 880, rodape: rodapePadrao('Finalizar conferência'), onConfirm: () => finalizarConferencia(ps, esp) });
  const raiz = $('#cf-corpo');
  raiz.addEventListener('input', e => {
    if (!e.target.classList.contains('cf-n')) return;
    const pid = e.target.closest('tr').dataset.pid;
    if (e.target.value.trim() === '') delete prog[pid]; else prog[pid] = e.target.value;
    salvarProg(); atualizar();
  });
  raiz.addEventListener('click', e => {
    const b = e.target.closest('.cf-ok'); if (!b) return;
    const tr = b.closest('tr'), p = P.find(x => x.id === tr.dataset.pid);
    tr.querySelector('.cf-n').value = esp(p); prog[p.id] = String(esp(p)); salvarProg(); atualizar();
  });
  atualizar();
}
function finalizarConferencia(ps, esp) {
  const linhas = [];
  for (const tr of $$('#cf-corpo tr')) {
    const v = tr.querySelector('.cf-n').value.trim(); if (v === '') continue;
    const p = ps.find(x => x.id === tr.dataset.pid), n = parseInt(v, 10);
    if (!(n >= 0)) return erro(`${p.nome}: quantidade inválida.`);
    linhas.push({ p, n, d: n - esp(p) });
  }
  if (!linhas.length) return erro('Preencha ao menos um item.');
  const difs = linhas.filter(x => x.d !== 0), falt = difs.filter(x => x.d < 0), sobr = difs.filter(x => x.d > 0);
  const msg = `${linhas.length} produto(s) conferido(s), ${linhas.length - difs.length} sem diferença.`
    + (falt.length ? `<br><br><b>Faltas</b> (vão para "Ajuste de estoque", para você revisar):<br>${falt.map(x => `${esc(x.p.nome)}: ${x.d}`).join('<br>')}` : '')
    + (sobr.length ? `<br><br><b>Sobras</b> (entram como bonificação, custo 0):<br>${sobr.map(x => `${esc(x.p.nome)}: +${x.d}`).join('<br>')}` : '');
  confirmar('Finalizar conferência', msg, () => aplicarConferencia(difs), { texto: 'Aplicar' });
}
function aplicarConferencia(difs) {
  const hoje = hojeISO();
  let vf = DB.vendasFisicas.find(v => (v.pessoa || '').startsWith('Ajuste de estoque'));
  if (!vf) { vf = { id: uid(), pessoa: 'Ajuste de estoque (a identificar)', pago: 0, data: hoje }; DB.vendasFisicas.push(vf); }
  let nf = 0, ns = 0;
  for (const { p, d } of difs) {
    const livres = unidadesDisponiveis(p.id);
    if (d < 0) {
      const n = Math.min(-d, livres.length);
      for (const u of [...livres].sort((a, b) => (b.dCompra || '').localeCompare(a.dCompra || '')).slice(0, n)) {
        Object.assign(u, { status: 'vendido', unid: 0, dVenda: hoje, vendaFisica: vf.id, venda: null, taxa: 0, frete: 0, mlPedido: null });
      }
      nf += n;
    } else {
      const modelo = livres[0] || DB.estoque.filter(i => i.produto === p.id).sort((a, b) => (b.dCompra || '').localeCompare(a.dCompra || ''))[0];
      for (let k = 0; k < d; k++) {
        const base = modelo ? { ...modelo } : { produto: p.id, venda: null, taxa: null, frete: null };
        delete base.nfCompra;
        DB.estoque.push({ ...base, id: uid(), fornecedor: 'Bonificação', custo: 0, nf: null, lote: null, validade: null, dCompra: hoje, status: 'avenda', unid: 1, dVenda: null, vendaFisica: null, mlPedido: null });
      }
      ns += d;
    }
  }
  DB.config.ultimaConferencia = hoje;
  try { localStorage.removeItem(CONF_LS); } catch (_) { /* sem cache */ }
  recalcPendencias();
  commit(`Conferência concluída: ${plural(nf, 'baixa', 'baixas')} e ${plural(ns, 'sobra', 'sobras')}`);
}

/* ---------- Venda física ---------- */
function linhaFisica() {
  return `<tr class="vf-linha"><td class="w-prod"><input class="vf-prod" list="dl-vf" placeholder="Produto" autocomplete="off" aria-label="Produto"></td>
  <td><input class="vf-qtd" type="number" min="1" value="1" aria-label="Quantidade"></td>
  <td><input class="vf-preco" inputmode="decimal" placeholder="0,00" aria-label="Preço unitário"></td>
  <td><button class="ghost-ic" data-action="removerLinha" aria-label="Remover linha">${ic('x', 16)}</button></td></tr>`;
}
function lerLinhasFisica(sel) {
  const pedidos = [];
  for (const [k, tr] of $$(sel).entries()) {
    const txt = tr.querySelector('.vf-prod').value.trim();
    if (!txt) continue;
    const prod = produtoPorLabel(txt);
    if (!prod) return erro(`Item ${k + 1}: produto não encontrado. Escolha da lista.`) || null;
    const qtd = parseInt(tr.querySelector('.vf-qtd').value, 10);
    if (!(qtd >= 1)) return erro(`Item ${k + 1}: quantidade inválida.`) || null;
    const preco = parseNum(tr.querySelector('.vf-preco').value);
    if (Number.isNaN(preco)) return erro(`Item ${k + 1}: confira o preço.`) || null;
    pedidos.push({ prod, qtd, preco, auto: parseNum(tr.querySelector('.vf-preco').dataset.auto || '') });
  }
  const precisa = {};
  pedidos.forEach(x => { precisa[x.prod.id] = (precisa[x.prod.id] || 0) + x.qtd; });
  for (const [pid, q] of Object.entries(precisa)) {
    const d = unidadesDisponiveis(pid).length;
    if (q > d) return erro(`${mapaProdutos()[pid].nome}: só há ${d} à venda.`) || null;
  }
  return pedidos;
}
function venderLinhasFisica(pedidos, vfId, data) {
  for (const x of pedidos) venderUnidades(unidadesDisponiveis(x.prod.id).slice(0, x.qtd), { venda: (x.auto != null && !Number.isNaN(x.auto) && Math.abs(x.auto - x.preco) < 0.005) ? null : x.preco, data, vendaFisica: vfId });
}
function preencherLinhaFisica(tr) {
  const p = produtoPorLabel(tr.querySelector('.vf-prod').value);
  const preco = tr.querySelector('.vf-preco');
  if (!p || preco.value) return;
  const u = unidadesDisponiveis(p.id)[0];
  if (u) { preco.value = fmtIn(u.precoFisica != null ? u.precoFisica : u.venda); preco.dataset.auto = preco.value; }   // V. Venda Física da unidade, se houver
}

  const corpo = `<div class="form-grid">

function renderBusca() {
  const box = $('#busca-res');
  const q = norm($('#busca-global').value.trim());
  if (!q) { box.hidden = true; box.innerHTML = ''; return; }
  const st = statsProdutos();
  const ps = DB.produtos.filter(p => norm(`${p.nome} ${p.sku} ${p.ean} ${p.fabricante}`).includes(q)).slice(0, 7);
  const vfs = DB.vendasFisicas.filter(v => norm(v.pessoa).includes(q)).slice(0, 4);
  const nfs = [...new Set(DB.estoque.map(i => i.nf).filter(nf => nf && norm(nf).includes(q)))].slice(0, 4);
  const encs = DB.encomendas.filter(e => norm(`${e.cliente} ${e.produto}`).includes(q)).slice(0, 3);
  let html = '';
  if (ps.length) html += `<div class="sr-group">Produtos</div>${ps.map(p => `<button class="sr-item" data-action="buscaProduto" data-id="${p.id}"><span>${esc(p.nome)}</span><small>${st[p.id].disp} disp.</small></button>`).join('')}`;
  if (vfs.length) html += `<div class="sr-group">Vendas físicas</div>${vfs.map(v => `<button class="sr-item" data-action="buscaFisica" data-id="${v.id}"><span>${esc(v.pessoa)}</span><small>${fdata(v.data)}</small></button>`).join('')}`;
  if (nfs.length) html += `<div class="sr-group">Notas fiscais</div>${nfs.map(nf => `<button class="sr-item" data-action="buscaNF" data-nf="${esc(nf)}"><span>NF ${esc(nf)}</span></button>`).join('')}`;
  if (encs.length) html += `<div class="sr-group">Encomendas</div>${encs.map(e => `<button class="sr-item" data-action="buscaEncomenda" data-id="${e.id}"><span>${esc(e.cliente)} · ${esc(e.produto)}</span><small>${esc(e.status)}</small></button>`).join('')}`;
  box.innerHTML = html || '<div class="sr-vazio">Nada encontrado</div>';
  box.hidden = false;
}
function fecharBusca() { const b = $('#busca-global'); b.value = ''; renderBusca(); b.blur(); }

const VIEWS = { marketing: vMarketing, hoje: vHoje, inicio: vInicio, produtos: vProdutos, estoque: vEstoque, compras: vCompras, vendas: vVendas, fisicas: vFisicas, encomendas: vEncomendas, dre: vDRE, financeiro: vFinanceiro, fluxo: vFluxo, rentabilidade: vRentabilidade, despesas: vFluxo, config: vConfig };
function render() {
  const a = document.activeElement;
  const id = a && a.id && $('#main').contains(a) ? a.id : null;
  let sel = null;
  try { if (id) sel = [a.selectionStart, a.selectionEnd]; } catch (e) { sel = null; }
  const scroll = $('#main .table-wrap')?.scrollLeft;
  renderNav();
  $('#main').innerHTML = VIEWS[UI.view]();
  if (scroll) { const w = $('#main .table-wrap'); if (w) w.scrollLeft = scroll; }
  atualizarBadgeNotif();
  if (id) {
    const el = document.getElementById(id);
    if (el) { el.focus(); try { if (sel && sel[0] != null) el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* campo sem seleção */ } }
  }
}
let renderTimer = null;
function agendarRender(ms) { clearTimeout(renderTimer); renderTimer = setTimeout(render, ms); }
function go(view) {
  view = aliasView(view);
  document.body.classList.remove('menu-aberto');
  if (location.hash.slice(1) === view) { UI.view = view; render(); window.scrollTo(0, 0); }
  else location.hash = view;
}
const aliasView = v => { if (v === 'despesas') { UI.fluxo.tab = 'lancamentos'; return 'fluxo'; } return v; };
window.addEventListener('hashchange', () => {

});

  return j;
}

function statusNuvem(txt, erroFlag = false) { const el = $('#save-status'); if (el) { el.className = 'save-status' + (erroFlag ? ' erro' : ''); el.textContent = txt; } }
function agendarNuvem() {
  if (!sessao() || nuvemBloqueada) return;
  nuvemSuja = true; lsSet(LS_KEY + ':pend', '1');
  clearTimeout(nuvemTimer);
  nuvemTimer = setTimeout(empurrarNuvem, 1200);
}
async function empurrarNuvem() {
  if (nuvemEnviando) { nuvemTimer = setTimeout(empurrarNuvem, 1500); return; }
  if (!nuvemSuja || nuvemBloqueada || !sessao()) return;
  nuvemEnviando = true; nuvemSuja = false;
  try {
    const r = await chamar('bo-dados', { method: 'PUT', body: { dados: DB, versao_base: VERSAO } });
    VERSAO = r.versao; lsSet(LS_KEY + ':v', String(VERSAO));
    if (!nuvemSuja) { lsSet(LS_KEY + ':pend', '0'); statusNuvem('Salvo na nuvem'); }
  } catch (e) {
    nuvemSuja = true;
    if (e.status === 409) { nuvemBloqueada = true; statusNuvem('Dados mudaram em outro aparelho: recarregue a página', true); toast('Os dados foram alterados em outro aparelho. Recarregue a página antes de continuar, senão suas alterações aqui não serão salvas na nuvem.', true); }
    else statusNuvem('Salvo só neste navegador (sem conexão com a nuvem)', true);
  }
  nuvemEnviando = false;
}
window.addEventListener('online', () => { if (nuvemSuja) agendarNuvem(); });

async function carregarNuvem() {
  statusNuvem('Carregando da nuvem...');
  try {
    const r = await chamar('bo-dados');
    if (r.dados) {
      const pendente = lsGet(LS_KEY + ':pend') === '1' && Number(lsGet(LS_KEY + ':v') || 0) === r.versao;
      if (!pendente) {
        DB = { ...dadosVazios(), ...r.dados, config: { ...configPadrao(), ...(r.dados.config || {}) } };
        lsSet(LS_KEY, JSON.stringify(DB));
      }
      VERSAO = r.versao; lsSet(LS_KEY + ':v', String(VERSAO));
      statusNuvem('Salvo na nuvem');
      if (pendente) agendarNuvem();
    } else if (DB.produtos.length) {            // nuvem vazia e este navegador tem dados: sobe tudo
      VERSAO = 0; nuvemSuja = true; await empurrarNuvem();
    } else { VERSAO = 0; statusNuvem('Nuvem vazia: importe um backup'); }
  } catch (e) { statusNuvem('Sem conexão com a nuvem: usando cópia deste navegador', true); }
}

function mostrarLogin(msg = '') {
  let el = $('#login-root');
  if (!el) { el = document.createElement('div'); el.id = 'login-root'; document.body.appendChild(el); }
  el.innerHTML = `<div class="login-tela"><form class="login-card" id="form-login" autocomplete="on">
    <img class="login-logo" src="assets/logo-horizontal.png" alt="Bela Ordem"><p style="text-align:center">Entre para acessar a plataforma.</p>
    <div class="f"><label for="lg-email">E-mail</label><input id="lg-email" type="email" autocomplete="username" required value="${esc(sessao()?.email || '')}"></div>
    <div class="f"><label for="lg-senha">Senha</label><input id="lg-senha" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-dark" type="submit">Entrar</button>
    <div class="login-erro" id="lg-erro" role="alert">${esc(msg)}</div></form></div>`;
  setTimeout(() => $('#lg-email')?.focus(), 30);
}
/* freio de tentativas de login neste aparelho (5 erros seguidos: espera de 30 s que dobra até 15 min); o limite de verdade fica no servidor */
function loginBloqueio() { try { const x = JSON.parse(localStorage.getItem('bo_lg') || '{}'); return Math.max(0, Math.ceil(((x.ate || 0) - Date.now()) / 1000)); } catch (_) { return 0; } }
function loginFalhou() {
  try {
    const x = JSON.parse(localStorage.getItem('bo_lg') || '{}'), n = (x.n || 0) + 1;
    localStorage.setItem('bo_lg', JSON.stringify({ n, ate: n >= 5 ? Date.now() + Math.min(900, 30 * 2 ** (n - 5)) * 1000 : 0 }));
  } catch (_) { /* sem armazenamento */ }
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'form-login') return;
  e.preventDefault();
  const btn = e.target.querySelector('button'), er = $('#lg-erro');
  const bl = loginBloqueio();
  if (bl > 0) { er.textContent = `Muitas tentativas. Tente de novo em ${bl} s.`; return; }
  btn.disabled = true; er.textContent = '';
  try {
    const j = await authFetch('token?grant_type=password', { email: $('#lg-email').value.trim(), password: $('#lg-senha').value });
    gravarSessao(sessaoDe(j)); try { localStorage.removeItem('bo_lg'); } catch (_) { /* sem armazenamento */ }
    $('#login-root').innerHTML = '';
    await iniciarApp();
  } catch (err) { loginFalhou(); er.textContent = /invalid/i.test(err.message) ? 'E-mail ou senha incorretos.' : err.message; btn.disabled = false; }
});
function sairDaConta() {
  gravarSessao(null);
  try { for (const k of ['', ':v', ':pend']) localStorage.removeItem(LS_KEY + k); } catch (e) { /* sem armazenamento */ }
  location.reload();
}

async function iniciarApp() {
  carregar();
  await carregarNuvem();
  { const hv = aliasView(location.hash.slice(1)); UI.view = VIEWS[hv] ? hv : 'inicio'; }
  render();
  mlAuto();
  recalcPendencias();
}

/* ---------- início ---------- */
(async () => { if (await tokenValido()) await iniciarApp(); else mostrarLogin(); })();
</script>
</body>
