/* Sincronização automática ao abrir o site: traz os pedidos recentes e os fretes, lança sozinho só o que é seguro
   (últimos 14 dias, anúncio com um único produto possível) e devolve ao estoque o que o ML cancelou.
   O que for duvidoso (sem estoque, sem vínculo, provável) fica para você revisar em "Conferir com meu estoque". */
const AUTO_DIAS = 14;
async function mlAuto() {
  if (ML.autoRodou || !sessao() || !DB?.produtos?.length || nuvemBloqueada) return;
  ML.autoRodou = true;
  try {
    ML.status = await mlChamar('status');
    if (!ML.status.connected) return;
    ML.autoMsg = 'Sincronizando com o Mercado Livre...'; if (UI.view === 'config') render();
    await mlChamar('sync', { days: 10 });
    for (let k = 0; k < 6; k++) { const r = await mlChamar('fretes', { limite: 60 }); if (!r.restantes || !r.feitos) break; }
    ML.pedidos = await mlListarTudo();
    const desde = new Date(Date.now() - AUTO_DIAS * 864e5).toISOString().slice(0, 10);
    const linhas = mlAnalisar().filter(l => l.data >= desde);
    const seguras = linhas.filter(l => ['dup', 'nova', 'bonif'].includes(l.estado) && candidatosMl(l.it).length === 1);
    const r = seguras.length ? aplicarLinhasML(seguras) : { novas: 0, vinc: 0, novas_boni: 0 };
    // fretes reais nas unidades ligadas que ainda estão sem frete
    const por = {}; DB.estoque.forEach(u => { if (u.mlPedido) (por[u.mlPedido] = por[u.mlPedido] || []).push(u); });
    let fretes = 0;
    for (const o of ML.pedidos) {
      const us = por[o.id]; if (!us || o.frete_vendedor == null) continue;
      const f = Math.round(Number(o.frete_vendedor) / us.length * 100) / 100;
      for (const u of us) if (u.frete == null) { u.frete = f; fretes++; }
    }
    // pedidos cancelados nos últimos 30 dias: a unidade volta ao estoque
    const desde30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    let devol = 0;
    for (const o of ML.pedidos) {
      if (o.status !== 'cancelled' || dataBR(o.date_created) < desde30) continue;
      const us = DB.estoque.filter(u => u.mlPedido === o.id && u.status === 'vendido');
      if (us.length) { devolverUnidades(us); us.forEach(u => { u.mlPedido = null; }); devol += us.length; }
    }
    const semDesde = !DB.config.notifDesde, novosAvisos = mlNotificarPedidos();
    const revisar = linhas.filter(l => ['semestoque', 'semprod', 'prov', 'revisar'].includes(l.estado)).length;
    const partes = [];
    if (r.novas + r.novas_boni) partes.push(`${plural(r.novas + r.novas_boni, 'venda lançada', 'vendas lançadas')}`);
    if (r.vinc) partes.push(`${r.vinc} já existente(s) alinhada(s)`);
    if (fretes) partes.push(`${plural(fretes, 'frete', 'fretes')}`);
    if (devol) partes.push(`${plural(devol, 'devolução', 'devoluções')}`);
    ML.autoMsg = partes.length || revisar ? `Última sincronização: ${partes.join(', ') || 'nada novo'}${revisar ? ` · ${plural(revisar, 'pedido', 'pedidos')} para revisar` : ''}` : 'Mercado Livre em dia';
    iniciarPoll(); recalcPendencias();
    if (partes.length || novosAvisos || semDesde) { commit(); }
    if (partes.length) { toast(`Mercado Livre: ${partes.join(', ')}${revisar ? ` · ${revisar} para revisar` : ''}`); }
    else if (UI.view === 'config') render();
  } catch (e) { ML.autoMsg = `Sincronização automática falhou: ${e.message}`; if (UI.view === 'config') render(); }
}

/* Mês a mês: o que o ML informou (pedidos pagos) contra o que o site tem lançado como venda do ML. Tem que bater. */
function mlDivergencias() {
  if (!ML.pedidos?.length) return '';
  const m = {};
  const lin = k => m[k] = m[k] || { mu: 0, mv: 0, su: 0, sv: 0 };
  for (const o of ML.pedidos) {
    if (o.status !== 'paid') continue;
    const it = o.items?.[0]; if (!it) continue;
    const x = lin(dataBR(o.date_created).slice(0, 7)); x.mu += it.qty || 1; x.mv += (it.unit_price || 0) * (it.qty || 1);
  }
  for (const u of DB.estoque) {
    if (u.status !== 'vendido' || u.vendaFisica || !u.dVenda) continue;
    const x = lin(u.dVenda.slice(0, 7)); x.su++; x.sv += u.venda || 0;
  }
  const todos = Object.keys(m).sort().reverse(), meses = ML.todosMeses ? todos : todos.slice(0, 6);
  const tot = meses.reduce((t, k) => t + Math.abs(m[k].su - m[k].mu), 0);
  return `<div class="sub-title" style="margin-top:16px">Conferência mês a mês: ML contra site ${tot ? `<span class="chip c-orange">${tot} unidade(s) de diferença</span>` : '<span class="chip c-green">tudo batendo</span>'}</div>
    <div class="table-wrap livre"><table><thead><tr><th>Mês</th><th class="num">ML un.</th><th class="num">Site un.</th><th class="num">Dif.</th><th class="num">ML R$</th><th class="num">Site R$</th><th class="num">Dif. R$</th></tr></thead><tbody>
    ${meses.map(k => { const x = m[k], du = x.su - x.mu, dv = x.sv - x.mv; const cls = Math.abs(du) || Math.abs(dv) > 1 ? 'neg' : '';
      return `<tr><td>${nomeMes(k)}</td><td class="num">${x.mu}</td><td class="num">${x.su}</td><td class="num ${cls}">${du}</td><td class="num">${brl(x.mv)}</td><td class="num">${brl(x.sv)}</td><td class="num ${cls}">${brl(dv)}</td></tr>`; }).join('')}
    </tbody></table></div>${todos.length > 6 ? `<button class="btn btn-sm btn-soft" style="margin-top:8px" data-action="mlTodosMeses">${ML.todosMeses ? 'Mostrar só os 6 últimos meses' : `Ver todos os ${todos.length} meses (desde ${nomeMes(todos[todos.length - 1])})`}</button>` : ''}`;
}

async function mlAtualizar() {
  ML.verificando = true;
  try {
    ML.status = await mlChamar('status');
    if (ML.status.connected) ML.pedidos = await mlListarTudo();
  } catch (e) { ML.status = { connected: false }; toast(e.message, true); }
  ML.verificando = false;
  if (UI.view === 'config') render();
}

      const fisica = $('input[name=vx-canal]:checked').value === 'fisica';
      const itens = [], uso = {};
      for (const [k, tr] of $$('#vx-linhas .vx-linha').entries()) {
        if (!tr.querySelector('.vx-inc').checked) continue;
        const prod = produtoPorLabel(tr.querySelector('.vx-prod').value);
        if (!prod) return erro(`Linha ${k + 1}: escolha o produto da lista ou desmarque a linha.`);
        const qtd = parseInt(tr.querySelector('.vx-qtd').value, 10);
        if (!(qtd >= 1)) return erro(`Linha ${k + 1}: quantidade inválida.`);
        const [venda, taxa, frete] = ['.vx-venda', '.vx-taxa', '.vx-frete'].map(c => parseNum(tr.querySelector(c).value));
        if ([venda, taxa, frete].some(Number.isNaN)) return erro(`Linha ${k + 1}: confira os valores.`);
        uso[prod.id] = (uso[prod.id] || 0) + qtd;
        if (uso[prod.id] > unidadesDisponiveis(prod.id).length) return erro(`${prod.nome}: só há ${plural(unidadesDisponiveis(prod.id).length, 'unidade disponível', 'unidades disponíveis')}, e as notas pedem ${uso[prod.id]}.`);
        itens.push({ prod, qtd, venda, taxa: taxa == null ? null : taxa / 100, frete, nota: MODAL.notas[+tr.dataset.n] });
      }
      if (!itens.length) return erro('Nenhum item marcado para lançar.');
      let total = 0;
      for (const x of itens) {
        const vf = fisica ? obterVendaFisica(x.nota.cliente || 'Cliente sem nome', x.nota.data || hojeISO()) : null;
        const us = unidadesDisponiveis(x.prod.id).slice(0, x.qtd);
        venderUnidades(us, { venda: x.venda, taxa: x.taxa, frete: x.frete, data: x.nota.data || hojeISO(), vendaFisica: vf });
        us.forEach(u => { u.nfVenda = x.nota.chave || null; });
        total += us.length;
      }
      commit(`${plural(total, 'unidade vendida', 'unidades vendidas')} a partir de ${plural(new Set(itens.map(x => x.nota)).size, 'nota', 'notas')}`);
    },
  });
}

/* margem da linha = venda − taxa ML − frete − custo (mesma fórmula do lucro das vendas) */
function atualizarMargemCompra(tr) {
  const [custo, venda, taxa, frete] = ['.mc-custo', '.mc-venda', '.mc-taxa', '.mc-frete'].map(c => parseNum(tr.querySelector(c).value));
  const ok = [custo, venda, taxa, frete].every(x => !Number.isNaN(x)) && venda;
  const i = ok ? { custo, venda, taxa: (taxa || 0) / 100, frete } : null;
  const l = i ? lucro(i) : null;
  const marca = (cls, txt) => { const td = tr.querySelector(cls); td.textContent = txt; td.className = `num ${cls.slice(1)} ${l == null ? 'faint' : l < 0 ? 'neg' : ''}`; };
  marca('.mc-mrs', l == null ? '—' : brl(l));
  marca('.mc-mpc', l == null ? '—' : pct(margem(i)));
}
function preencherLinhaCompra(tr) {
  const p = produtoPorLabel(tr.querySelector('.mc-prod').value);
  if (!p) return;
  const ult = DB.estoque.filter(i => i.produto === p.id).sort((a, b) => (b.dCompra || '').localeCompare(a.dCompra || ''))[0];
  if (!ult) return;
  const set = (cls, v) => { const el = tr.querySelector(cls); if (el && !el.value) el.value = fmtIn(v); };
  set('.mc-custo', ult.custo);
  set('.mc-venda', ult.venda);
  set('.mc-frete', ult.frete);
}
/* EAN: compara sem zeros à esquerda e aceita EANs alternativos; entre produtos com o mesmo EAN (kits), prefere o que não é kit */
const soEan = x => String(x || '').replace(/\D/g, '').replace(/^0+/, '');
function produtoPorEan(ean) {
  const e = soEan(ean);
  if (!e) return null;
  const c = DB.produtos.filter(p => soEan(p.ean) === e || (p.eanAlt || []).some(a => soEan(a) === e));
  return c.find(p => !/^kit\b/i.test(p.nome)) || c[0] || null;
}
const ignorarItemNota = (nome, ean) => (DB.config.ignorarNotas || []).some(k => norm(nome).includes(norm(k))) || (!!ean && (DB.config.ignorarEan || []).some(e => soEan(e) === soEan(ean)));
/* Lê o XML da NF-e (nfeProc ou NFe): fornecedor, número, data e itens com custo unitário
   (produtos + frete + seguro + outras despesas − desconto, dividido pela quantidade). */
function lerNFe(texto) {
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  const inf = doc.getElementsByTagNameNS('*', 'infNFe')[0];
  if (doc.querySelector('parsererror') || !inf) return null;
  const t = (el, tag) => el?.getElementsByTagNameNS('*', tag)[0]?.textContent.trim() || '';
  const n = (el, tag) => parseFloat(t(el, tag)) || 0;
  const ide = inf.getElementsByTagNameNS('*', 'ide')[0], emit = inf.getElementsByTagNameNS('*', 'emit')[0];
  const itens = [...inf.getElementsByTagNameNS('*', 'det')].flatMap(det => {
    const pr = det.getElementsByTagNameNS('*', 'prod')[0];
    const qtd = n(pr, 'qCom') || 1;
    const total = n(pr, 'vProd') + n(pr, 'vFrete') + n(pr, 'vSeg') + n(pr, 'vOutro') - n(pr, 'vDesc');
    const ean = [t(pr, 'cEAN'), t(pr, 'cEANTrib')].find(x => /^\d{8,14}$/.test(x)) || '';
    const base = { nome: t(pr, 'xProd'), ean, ncm: t(pr, 'NCM'), custo: total / qtd, valorUn: (n(pr, 'vProd') - n(pr, 'vDesc')) / qtd };
    // rastreabilidade (<rastro>): número do lote e validade; uma nota pode ter vários lotes no mesmo item
    const rastros = [...det.getElementsByTagNameNS('*', 'rastro')].map(r => ({ lote: t(r, 'nLote') || null, q: n(r, 'qLote'), validade: t(r, 'dVal') || null }));
    if (rastros.length > 1 && Math.abs(rastros.reduce((a, r) => a + r.q, 0) - qtd) < 0.5) {
      return rastros.map(r => ({ ...base, qtd: Math.max(1, Math.round(r.q)), lote: r.lote, validade: r.validade || t(det, 'dVal') || null }));
    }
    const r0 = rastros[0];
    return [{ ...base, qtd: Math.max(1, Math.round(qtd)), lote: r0?.lote || null, validade: r0?.validade || t(det, 'dVal') || null }];
  });
  const dest = inf.getElementsByTagNameNS('*', 'dest')[0];
  return { chave: (inf.getAttribute('Id') || '').replace(/^NFe/, ''), cliente: t(dest, 'xNome'), fornecedor: t(emit, 'xNome'), nf: t(ide, 'nNF'), data: (t(ide, 'dhEmi') || t(ide, 'dEmi')).slice(0, 10), itens };
}
function importarNFe(texto) {
  const nfe = lerNFe(texto);
  if (nfe) nfe.itens = nfe.itens.filter(i => !ignorarItemNota(i.nome, i.ean) || produtoPorEan(i.ean));
  if (!nfe || !nfe.itens.length) return erro('Este arquivo não parece o XML de uma NF-e.');
  const so = x => String(x || '').replace(/\D/g, '');
  const achar = it => produtoPorEan(it.ean) || DB.produtos.find(p => norm(p.nome) === norm(it.nome)) || null;
  const forn = DB.config.fornecedores.find(f => norm(nfe.fornecedor).includes(norm(f)) || norm(f).includes(norm(nfe.fornecedor))) || nfe.fornecedor;
  $('#mc-forn').value = forn;
  $('#mc-nf').value = nfe.nf;
  if (nfe.data) $('#mc-data').value = nfe.data;
  const sem = [];
  $('#mc-linhas').innerHTML = nfe.itens.map(() => linhaCompra()).join('');
  nfe.itens.forEach((it, i) => {
    const tr = $('#mc-linhas').children[i], prod = achar(it);
    tr.querySelector('.mc-qtd').value = it.qtd;
    tr.querySelector('.mc-custo').value = fmtIn(Math.round(it.custo * 100) / 100);
    if (it.validade) tr.querySelector('.mc-val').value = it.validade;
    if (it.lote) tr.querySelector('.mc-lote').value = it.lote;
    if (prod) { tr.querySelector('.mc-prod').value = labelProduto(prod); preencherLinhaCompra(tr); }
    else { tr.classList.add('mc-pend'); tr.querySelector('.mc-prod').placeholder = it.nome; sem.push(it); }
  });
  const jaLancada = nfe.nf && DB.estoque.some(i => i.nf === nfe.nf && norm(i.fornecedor) === norm(forn));
  $('#mc-aviso').innerHTML =
    (jaLancada ? `<div class="info" style="background:var(--yel-bg);color:#5c4700">Atenção: já existe uma compra com a NF ${esc(nfe.nf)} deste fornecedor. Confira para não lançar em duplicidade.</div>` : '') +
    (sem.length ? `<div class="info"><b>${plural(sem.length, 'item sem produto correspondente', 'itens sem produto correspondente')}</b> (linhas em vermelho). Escolha o produto na lista ou cadastre em Produtos → Novo produto e importe de novo:<br>${sem.map(it => `• ${esc(it.nome)}${it.ean ? ` · EAN ${it.ean}` : ''}${it.ncm ? ` · NCM ${it.ncm}` : ''}`).join('<br>')}</div>` : '');
  $$('#mc-linhas .mc-linha').forEach(atualizarMargemCompra);
  toast(`NF ${nfe.nf || ''} lida: ${plural(nfe.itens.length, 'item', 'itens')}${sem.length ? `, ${sem.length} sem produto` : ''}. Confira e lance.`);
}
/* ---------- Conferir várias NF-e de compra de uma vez ---------- */
const nfNum = x => String(x || '').replace(/\D/g, '').replace(/^0+/, '');
const mesmoForn = (a, b) => { a = norm(a); b = norm(b); return !!a && !!b && (a.includes(b) || b.includes(a)); };

function analisarNotasCompra(arquivos) {
  const vistas = new Set(), notas = [], invalidos = [];
  const so = x => String(x || '').replace(/\D/g, '');
  for (const a of arquivos) {
    const nfe = lerNFe(a.texto);
    if (!nfe || !nfe.itens.length) { invalidos.push(a.nome); continue; }
    const id = nfe.chave || `${nfe.fornecedor}|${nfe.nf}`;
    if (vistas.has(id)) continue;
    vistas.add(id);
    const forn = DB.config.fornecedores.find(f => mesmoForn(nfe.fornecedor, f)) || nfe.fornecedor;
    const itens = nfe.itens.map(it => ({ ...it, prod: produtoPorEan(it.ean) || DB.produtos.find(p => norm(p.nome) === norm(it.nome)) || null }))
      .filter(i => i.prod || !ignorarItemNota(i.nome, i.ean));
    const total = itens.filter(i => i.prod).reduce((t, i) => t + i.qtd, 0);
    const doMesmoNf = DB.estoque.filter(u => (nfe.chave && u.nfCompra === nfe.chave) || (nfNum(u.nf) && nfNum(u.nf) === nfNum(nfe.nf) && mesmoForn(u.fornecedor, forn)));
    const outroForn = !doMesmoNf.length && nfNum(nfe.nf) && DB.estoque.some(u => nfNum(u.nf) === nfNum(nfe.nf));
    const semProd = itens.filter(i => !i.prod);
    let estado = 'faltando';
    if (doMesmoNf.length >= total) estado = 'lancada';
    else if (doMesmoNf.length) estado = 'parcial';
    else if (outroForn) estado = 'talvez';
    else if (semProd.length) estado = 'semprod';
    notas.push({ nfe, forn, itens, total, lancadas: doMesmoNf.length, semProd, estado, valor: itens.reduce((t, i) => t + i.custo * i.qtd, 0) });
  }
  notas.sort((a, b) => (a.nfe.data || '').localeCompare(b.nfe.data || ''));
  return { notas, invalidos };
}

const NOTA_ESTADOS = {
  lancada: ['c-green', 'Já lançada', false],
  parcial: ['c-orange', 'Lançada pela metade: revise à mão', false],
  talvez: ['c-orange', 'Mesmo nº de NF em outro fornecedor: revise', false],
  semprod: ['c-red', 'Falta cadastrar produto', false],
  faltando: ['c-yellow', 'Não lançada', true],
};

/* Cadastro guiado dos produtos de NF-e que não existem no site: um por vez, com confirmação de cada um. */
const acharProdutoXml = it => produtoPorEan(it.ean) || DB.produtos.find(p => norm(p.nome) === norm(it.nome)) || null;

function abrirCadastroXml(f) {
  while (f.i < f.fila.length && acharProdutoXml(f.fila[f.i])) f.i++;   // já cadastrado por fora
  if (f.i >= f.fila.length) { fecharModal(); modalNotasCompra(f.arquivos); return; }
  const it = f.fila[f.i];
  const skuSug = Math.max(0, ...DB.produtos.map(x => x.sku || 0)) + 1;
  const fabSug = DB.config.fabricantes.find(x => norm(it.nome).includes(norm(x))) || '';
  const corpo = `<div class="info">Produto <b>${f.i + 1} de ${f.fila.length}</b> que está na nota e ainda não existe no site. Confira os dados e confirme.</div>
  <div class="form-grid" style="margin-top:12px">${campo('pr-nome', 'Nome', inputTxt('pr-nome', it.nome), 'full')}</div>
  <div class="form-grid">
    ${campo('pr-sku', 'SKU', `<input id="pr-sku" type="number" value="${skuSug}">`)}
    ${campo('pr-fab', 'Fabricante', `<input id="pr-fab" list="dl-fab" value="${esc(fabSug)}" autocomplete="off">${datalistLista('dl-fab', DB.config.fabricantes)}`)}
  </div>
  <div class="form-grid"><div class="f full"><span class="lbl">Categorias</span><div class="chips" style="gap:8px">${DB.config.tipos.map(t => `<label class="check" style="background:#f6f6f9;padding:6px 10px;border-radius:8px"><input type="checkbox" class="pr-tipo" value="${esc(t)}"> ${esc(t)}</label>`).join('')}</div></div></div>
  <div class="form-grid">${campo('pr-ncm', 'NCM', inputTxt('pr-ncm', it.ncm))}${campo('pr-ean', 'EAN', inputTxt('pr-ean', it.ean))}</div>`;
  abrirModal({
    titulo: 'Cadastrar produto da nota', corpo, largura: 680, dados: { fluxo: f },
    rodape: `<button class="btn btn-soft" data-action="fecharModal">Parar aqui</button><button class="btn btn-soft" data-action="pularCadastro">Pular este</button><button class="btn btn-dark" data-action="confirmarModal">Cadastrar e continuar</button>`,
    onConfirm: () => {
      const nome = val('pr-nome');
      if (!nome) return erro('Informe o nome do produto.');
      const dados = { nome, sku: num(val('pr-sku')), fabricante: val('pr-fab') || null, tipos: $$('.pr-tipo:checked').map(x => x.value), ncm: val('pr-ncm'), ean: val('pr-ean') };
      adicionarNaLista('fabricantes', dados.fabricante);
      DB.produtos.push({ id: uid(), ...dados });
      salvar(); toast('Produto cadastrado');
      f.i++; abrirCadastroXml(f);
      return false;
    },
  });
}

function modalNotasCompra(arquivos) {
  const { notas, invalidos } = analisarNotasCompra(arquivos);
  const cont = e => notas.filter(n => n.estado === e).length;
  const sem = notas.filter(n => n.semProd.length);
  const faltantes = [...new Map(notas.filter(n => n.estado !== 'lancada').flatMap(n => n.semProd).map(i => [i.ean || norm(i.nome), i])).values()];
  const corpo = `<div class="info">${plural(notas.length, 'nota', 'notas')} lidas: <b>${cont('lancada')} já lançadas</b>, <b>${cont('faltando')} não lançadas</b>, ${cont('semprod')} com produto sem cadastro, ${cont('parcial') + cont('talvez')} para revisar.${invalidos.length ? `<br>Não pareciam XML de NF-e: ${esc(invalidos.join(', '))}` : ''}<br>
    <span class="hint">As não lançadas entram no estoque com o custo da nota (frete e desconto já rateados). Venda, taxa e frete vêm da última compra do mesmo produto, e a taxa padrão se não houver. Baixe um backup antes de aplicar.</span></div>

/* ---------- Venda física ---------- */
function linhaFisica() {
  return `<tr class="vf-linha"><td class="w-prod"><input class="vf-prod" list="dl-vf" placeholder="Produto" autocomplete="off" aria-label="Produto"></td>
  <td><input class="vf-qtd" type="number" min="1" value="1" aria-label="Quantidade"></td>
  <td><input class="vf-preco" inputmode="decimal" placeholder="0,00" aria-label="Preço unitário"></td>
  <td><button class="ghost-ic" data-action="removerLinha" aria-label="Remover linha">${ic('x', 16)}</button></td></tr>`;
}
function lerLinhasFisica(sel) {
  const pedidos = [];
  for (const [k, tr] of $$(sel).entries()) {
    const txt = tr.querySelector('.vf-prod').value.trim();
    if (!txt) continue;
    const prod = produtoPorLabel(txt);
    if (!prod) return erro(`Item ${k + 1}: produto não encontrado. Escolha da lista.`) || null;
    const qtd = parseInt(tr.querySelector('.vf-qtd').value, 10);
    if (!(qtd >= 1)) return erro(`Item ${k + 1}: quantidade inválida.`) || null;
    const preco = parseNum(tr.querySelector('.vf-preco').value);
    if (Number.isNaN(preco)) return erro(`Item ${k + 1}: confira o preço.`) || null;
    pedidos.push({ prod, qtd, preco });
  }
  const precisa = {};
  pedidos.forEach(x => { precisa[x.prod.id] = (precisa[x.prod.id] || 0) + x.qtd; });
  for (const [pid, q] of Object.entries(precisa)) {
    const d = unidadesDisponiveis(pid).length;
    if (q > d) return erro(`${mapaProdutos()[pid].nome}: só há ${d} à venda.`) || null;
  }
  return pedidos;
}
function venderLinhasFisica(pedidos, vfId, data) {
  for (const x of pedidos) venderUnidades(unidadesDisponiveis(x.prod.id).slice(0, x.qtd), { venda: x.preco, data, vendaFisica: vfId });
}
function preencherLinhaFisica(tr) {
  const p = produtoPorLabel(tr.querySelector('.vf-prod').value);
  const preco = tr.querySelector('.vf-preco');
  if (!p || preco.value) return;
  const u = unidadesDisponiveis(p.id)[0];
  if (u) preco.value = fmtIn(u.venda);
}
function modalFisicaNova() {
  const corpo = `<div class="form-grid">
    ${campo('fn-pessoa', 'Cliente', `<input id="fn-pessoa" placeholder="Ex.: Pamela Setembro" autocomplete="off">`)}

  <p class="hint">As unidades saem do estoque (validade mais próxima primeiro), com taxa ML e frete zerados.</p>

  abrirModal({

function modalFisica(id) {
  const v = DB.vendasFisicas.find(x => x.id === id);

  const status = statusPgto(v.pago, venda);
  const grupos = {};
  itens.forEach(i => { const k = `${i.produto}|${i.venda}|${i.dVenda}`; (grupos[k] = grupos[k] || { it: i, ids: [] }).ids.push(i.id); });

  </div>
  <div class="stat-row">

  <div class="sub-title">Itens vendidos (${itens.length})</div>
  <div class="lines"><table><thead><tr><th>Produto</th><th class="num">Qtd</th><th class="num">Preço un.</th><th class="num">Custo un.</th><th>Data</th><th></th></tr></thead><tbody>
  ${Object.values(grupos).map(g => `<tr><td class="prod">${esc(P[g.it.produto]?.nome || '—')}</td><td class="num">${g.ids.length}</td><td class="num">${brl(g.it.venda)}</td><td class="num">${brl(g.it.custo)}</td><td class="muted">${fdata(g.it.dVenda)}</td><td><button class="btn btn-sm btn-soft" data-action="devolverFisica" data-id="${id}" data-uid="${g.ids[0]}">Devolver 1</button></td></tr>`).join('') || vazioLinha(6, 'Nenhum item vinculado.')}
  </tbody></table></div>
  <div class="sub-title">Adicionar itens</div>
  <div class="lines"><table><thead><tr><th>Produto</th><th>Qtd</th><th>Preço un.</th><th></th></tr></thead><tbody id="fd-linhas">${linhaFisica()}</tbody></table></div>
  <button class="btn btn-sm btn-soft" data-action="addLinhaFisica" data-alvo="fd-linhas">${ic('plus', 16)} Adicionar item</button>
  ${datalistProdutos('dl-vf', true)}`;
  abrirModal({
    titulo: esc(v.pessoa), corpo, largura: 820,
    rodape: rodapePadrao('Salvar', `<button class="btn btn-sm btn-danger left" data-action="excluirFisica" data-id="${id}">Excluir venda</button>`),
    onConfirm: () => {
      const pessoa = val('fd-pessoa');
      if (!pessoa) return erro('Informe o cliente.');
      const pago = parseNum(val('fd-pago'));
      if (Number.isNaN(pago)) return erro('Confira o valor pago.');
      const pedidos = lerLinhasFisica('#fd-linhas .vf-linha');

      commit('Venda física atualizada');
    },
  });
}

    corpo: `<div class="form-grid">${campo('de-nome', 'Nome', inputTxt('de-nome', d.nome, 'placeholder="Ex.: Embalagens, anúncio, contador"'), 'full')}</div><div class="form-grid">${campo('de-valor', 'Valor', inputNum('de-valor', d.valor))}${campo('de-data', 'Data', inputData('de-data', d.data))}</div>`,
    rodape: rodapePadrao('Salvar', id ? `<button class="btn btn-sm btn-danger left" data-action="excluirDespesa" data-id="${id}">Excluir</button>` : ''),
    onConfirm: () => {
      const nome = val('de-nome');
      const valor = parseNum(val('de-valor'));
      if (!nome) return erro('Informe o nome da despesa.');
      if (valor == null || Number.isNaN(valor)) return erro('Informe o valor.');
      const dados = { nome, valor, data: val('de-data') || null };
      if (id) Object.assign(d, dados); else DB.despesas.push({ id: uid(), ...dados });
      commit(id ? 'Despesa atualizada' : 'Despesa lançada');
    },
  });
}

/* =========================================================
   Busca geral
   ========================================================= */
function renderBusca() {
  const box = $('#busca-res');
  const q = norm($('#busca-global').value.trim());
  if (!q) { box.hidden = true; box.innerHTML = ''; return; }
  const st = statsProdutos();
  const ps = DB.produtos.filter(p => norm(`${p.nome} ${p.sku} ${p.ean} ${p.fabricante}`).includes(q)).slice(0, 7);
  const vfs = DB.vendasFisicas.filter(v => norm(v.pessoa).includes(q)).slice(0, 4);
  const nfs = [...new Set(DB.estoque.map(i => i.nf).filter(nf => nf && norm(nf).includes(q)))].slice(0, 4);
  const encs = DB.encomendas.filter(e => norm(`${e.cliente} ${e.produto}`).includes(q)).slice(0, 3);
  let html = '';
  if (ps.length) html += `<div class="sr-group">Produtos</div>${ps.map(p => `<button class="sr-item" data-action="buscaProduto" data-id="${p.id}"><span>${esc(p.nome)}</span><small>${st[p.id].disp} disp.</small></button>`).join('')}`;
  if (vfs.length) html += `<div class="sr-group">Vendas físicas</div>${vfs.map(v => `<button class="sr-item" data-action="buscaFisica" data-id="${v.id}"><span>${esc(v.pessoa)}</span><small>${fdata(v.data)}</small></button>`).join('')}`;
  if (nfs.length) html += `<div class="sr-group">Notas fiscais</div>${nfs.map(nf => `<button class="sr-item" data-action="buscaNF" data-nf="${esc(nf)}"><span>NF ${esc(nf)}</span></button>`).join('')}`;
  if (encs.length) html += `<div class="sr-group">Encomendas</div>${encs.map(e => `<button class="sr-item" data-action="buscaEncomenda" data-id="${e.id}"><span>${esc(e.cliente)} · ${esc(e.produto)}</span><small>${esc(e.status)}</small></button>`).join('')}`;
  box.innerHTML = html || '<div class="sr-vazio">Nada encontrado</div>';
  box.hidden = false;
}
function fecharBusca() { const b = $('#busca-global'); b.value = ''; renderBusca(); b.blur(); }

const VIEWS = { hoje: vHoje, inicio: vInicio, produtos: vProdutos, estoque: vEstoque, compras: vCompras, vendas: vVendas, fisicas: vFisicas, encomendas: vEncomendas, dre: vDRE, despesas: vDespesas, config: vConfig };
function render() {
  const a = document.activeElement;
  const id = a && a.id && $('#main').contains(a) ? a.id : null;
  let sel = null;
  try { if (id) sel = [a.selectionStart, a.selectionEnd]; } catch (e) { sel = null; }
  const scroll = $('#main .table-wrap')?.scrollLeft;
  renderNav();
  $('#main').innerHTML = VIEWS[UI.view]();
  if (scroll) { const w = $('#main .table-wrap'); if (w) w.scrollLeft = scroll; }
  atualizarBadgeNotif();
  if (id) {
    const el = document.getElementById(id);
    if (el) { el.focus(); try { if (sel && sel[0] != null) el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* campo sem seleção */ } }
  }
}
let renderTimer = null;
function agendarRender(ms) { clearTimeout(renderTimer); renderTimer = setTimeout(render, ms); }
function go(view) {
  document.body.classList.remove('menu-aberto');
  if (location.hash.slice(1) === view) { UI.view = view; render(); window.scrollTo(0, 0); }
  else location.hash = view;
}
window.addEventListener('hashchange', () => {
  if (!DB) return;   // ainda na tela de login
  const v = location.hash.slice(1);
  UI.view = VIEWS[v] ? v : 'inicio';
  render();
  window.scrollTo(0, 0);
  if (UI.view === 'config' && sessao() && !ML.status) mlAtualizar();
});

    ML.ocupado = true; let feitos = 0;

      for (;;) {

        const r = await mlChamar('fretes', { limite: 60 });
        feitos += r.feitos;
        if (r.erros?.length) toast(`Aviso do ML: ${r.erros[0]}`, true);
        if (!r.restantes || !r.feitos) break;
      }
      ML.pedidos = await mlListarTudo();
      toast(`${plural(feitos, 'pedido com frete buscado', 'pedidos com frete buscado')}`);

  mlAplicarFretes: () => {
    const por = {};
    DB.estoque.forEach(u => { if (u.mlPedido) (por[u.mlPedido] = por[u.mlPedido] || []).push(u); });
    const mud = [];
    for (const o of ML.pedidos || []) {
      const us = por[o.id];
      if (!us || o.frete_vendedor == null) continue;
      const f = Math.round(Number(o.frete_vendedor) / us.length * 100) / 100;
      for (const u of us) if (u.frete == null || Math.abs(u.frete - f) > 0.01) mud.push([u, f]);
    }
    if (!mud.length) return toast('Os fretes já estão iguais aos do ML.');
    confirmar('Aplicar fretes do ML', `Atualizar o frete de <b>${plural(mud.length, 'unidade', 'unidades')}</b> com o valor real cobrado pelo Mercado Livre? Isso muda o lucro dessas vendas. Baixe um backup antes se tiver dúvida.`, () => { mud.forEach(([u, f]) => { u.frete = f; }); commit('Fretes atualizados'); }, { texto: 'Aplicar' });

  mlHistorico: async () => {
    // mês a mês desde jan/2025 (anterior à abertura da conta devolve 0, sem problema)
    ML.ocupado = true; let total = 0; const hoje = new Date();
    try {
      for (let d = new Date(Date.UTC(2025, 0, 1)); d <= hoje; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) {
        const fim = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));

document.addEventListener('change', e => {

    const enc = DB.encomendas.find(x => x.id === el.dataset.id);
    if (enc) { enc.status = el.value; commit(`Encomenda: ${el.value}`); }
  }
  if (el.id === 'arquivo-nfe' && el.files[0]) {
    const leitor = new FileReader();
    leitor.onload = () => importarNFe(leitor.result);
    leitor.readAsText(el.files[0]);
    el.value = '';
  }
  if (el.id === 'arquivos-nfe-compra' && el.files.length) {
    const arqs = [...el.files];
    el.value = '';
    Promise.all(arqs.map(f => f.text().then(texto => ({ nome: f.name, texto })))).then(modalNotasCompra);
  }
  if (el.id === 'arquivos-nfe-venda' && el.files.length) {
    const arqs = [...el.files];
    el.value = '';
    Promise.all(arqs.map(f => f.text().then(texto => ({ nome: f.name, texto })))).then(modalVendasXml);
  }
  if (el.id === 'arquivo-import' && el.files[0]) {
    const leitor = new FileReader();
    leitor.onload = () => {
      let dados;
      try { dados = JSON.parse(leitor.result); } catch (err) { erro('Arquivo inválido: não é um JSON.'); return; }
      if (!dados || !Array.isArray(dados.produtos) || !Array.isArray(dados.estoque)) { erro('Este arquivo não parece um backup da Bela Ordem.'); return; }
      confirmar('Importar backup', `O backup tem ${dados.produtos.length} produtos e ${dados.estoque.length.toLocaleString('pt-BR')} unidades de estoque. Ele <b>substitui</b> os dados atuais deste navegador.`, () => {
        const base = dadosVazios();
        DB = { ...base, ...dados, config: { ...configPadrao(), ...(dados.config || {}) } };
        commit('Backup importado');
      }, { texto: 'Importar e substituir', perigo: true });
    };
    leitor.readAsText(el.files[0]);
    el.value = '';
  }
});

  const pn = $('#notif-panel');
  if (pn && !pn.hidden && !e.target.closest('#notif-panel') && !e.target.closest('#btn-notif')) pn.hidden = true;
}, true);
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.key === 'Escape') {
    if (MODAL || $('#modal-root').children.length) { fecharModal(); return; }
    if (!$('#busca-res').hidden) fecharBusca();
    document.body.classList.remove('menu-aberto');
  }
  if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) && !MODAL) { e.preventDefault(); $('#busca-global').focus(); }
  if (e.key === 'Enter' && MODAL && tag === 'INPUT' && e.target.closest('.modal') && !e.target.list) { e.preventDefault(); ACOES.confirmarModal(); }
  if (e.key === 'Enter' && e.target.id === 'busca-global') { const first = $('#busca-res .sr-item'); if (first) first.click(); }
});

const SB_URL = 'https://rjntddpjwqxxwmainogw.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqbnRkZHBqd3F4eHdtYWlub2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5OTI0MjUsImV4cCI6MjEwNDU2ODQyNX0.ukStu7Iby70z6pklAdv0-Gx24_duZ1gIBem7CwYiTP4'; // chave pública do projeto (feita para ficar no site)
const ML_URL = `${SB_URL}/functions/v1`;
const CHAVE_SESSAO = 'belaOrdemSessao';
let VERSAO = 0, nuvemTimer = null, nuvemBloqueada = false, nuvemEnviando = false, nuvemSuja = false;

function sessao() { try { return JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null'); } catch (e) { return null; } }
function gravarSessao(s) { try { s ? localStorage.setItem(CHAVE_SESSAO, JSON.stringify(s)) : localStorage.removeItem(CHAVE_SESSAO); } catch (e) { /* sem armazenamento */ } }
function sessaoDe(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expira: Date.now() + (j.expires_in || 3600) * 1000, email: j.user?.email || sessao()?.email || '' }; }
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } };

async function authFetch(caminho, corpo) {
  const r = await fetch(`${SB_URL}/auth/v1/${caminho}`, { method: 'POST', headers: { apikey: SB_ANON, 'content-type': 'application/json' }, body: JSON.stringify(corpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || `Erro ${r.status}`);
  return j;
}
async function tokenValido() {
  let s = sessao();
  if (!s) return null;
  if (s.expira - Date.now() < 60000) {
    try { s = sessaoDe(await authFetch('token?grant_type=refresh_token', { refresh_token: s.refresh_token })); gravarSessao(s); }
    catch (e) { gravarSessao(null); return null; }
  }
  return s.access_token;
}
async function chamar(fn, { method = 'GET', body } = {}) {
  const t = await tokenValido();
  if (!t) { mostrarLogin(); throw new Error('Sessão expirada. Entre de novo.'); }
  const r = await fetch(`${ML_URL}/${fn}`, { method, headers: { authorization: `Bearer ${t}`, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { gravarSessao(null); mostrarLogin('Este e-mail não tem acesso ao site.'); throw new Error(j.error || 'não autorizado'); }
  if (!r.ok) { const e = new Error(j.error || `Erro ${r.status}`); e.status = r.status; throw e; }
  return j;
}

function statusNuvem(txt, erroFlag = false) { const el = $('#save-status'); if (el) { el.className = 'save-status' + (erroFlag ? ' erro' : ''); el.textContent = txt; } }
function agendarNuvem() {
  if (!sessao() || nuvemBloqueada) return;
  nuvemSuja = true; lsSet(LS_KEY + ':pend', '1');
  clearTimeout(nuvemTimer);
  nuvemTimer = setTimeout(empurrarNuvem, 1200);
}
async function empurrarNuvem() {
  if (nuvemEnviando) { nuvemTimer = setTimeout(empurrarNuvem, 1500); return; }
  if (!nuvemSuja || nuvemBloqueada || !sessao()) return;
  nuvemEnviando = true; nuvemSuja = false;
  try {
    const r = await chamar('bo-dados', { method: 'PUT', body: { dados: DB, versao_base: VERSAO } });
    VERSAO = r.versao; lsSet(LS_KEY + ':v', String(VERSAO));
    if (!nuvemSuja) { lsSet(LS_KEY + ':pend', '0'); statusNuvem('Salvo na nuvem'); }
  } catch (e) {
    nuvemSuja = true;
    if (e.status === 409) { nuvemBloqueada = true; statusNuvem('Dados mudaram em outro aparelho: recarregue a página', true); toast('Os dados foram alterados em outro aparelho. Recarregue a página antes de continuar, senão suas alterações aqui não serão salvas na nuvem.', true); }
    else statusNuvem('Salvo só neste navegador (sem conexão com a nuvem)', true);
  }
  nuvemEnviando = false;
}
window.addEventListener('online', () => { if (nuvemSuja) agendarNuvem(); });

async function carregarNuvem() {
  statusNuvem('Carregando da nuvem...');
  try {
    const r = await chamar('bo-dados');
    if (r.dados) {
      const pendente = lsGet(LS_KEY + ':pend') === '1' && Number(lsGet(LS_KEY + ':v') || 0) === r.versao;
      if (!pendente) {
        DB = { ...dadosVazios(), ...r.dados, config: { ...configPadrao(), ...(r.dados.config || {}) } };
        lsSet(LS_KEY, JSON.stringify(DB));
      }
      VERSAO = r.versao; lsSet(LS_KEY + ':v', String(VERSAO));
      statusNuvem('Salvo na nuvem');
      if (pendente) agendarNuvem();
    } else if (DB.produtos.length) {            // nuvem vazia e este navegador tem dados: sobe tudo
      VERSAO = 0; nuvemSuja = true; await empurrarNuvem();
    } else { VERSAO = 0; statusNuvem('Nuvem vazia: importe um backup'); }
  } catch (e) { statusNuvem('Sem conexão com a nuvem: usando cópia deste navegador', true); }
}

function mostrarLogin(msg = '') {
  let el = $('#login-root');
  if (!el) { el = document.createElement('div'); el.id = 'login-root'; document.body.appendChild(el); }
  el.innerHTML = `<div class="login-tela"><form class="login-card" id="form-login" autocomplete="on">
    <h1>Bela Ordem</h1><p>Entre para acessar a plataforma.</p>
    <div class="f"><label for="lg-email">E-mail</label><input id="lg-email" type="email" autocomplete="username" required value="${esc(sessao()?.email || '')}"></div>
    <div class="f"><label for="lg-senha">Senha</label><input id="lg-senha" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-dark" type="submit">Entrar</button>
    <div class="login-erro" id="lg-erro" role="alert">${esc(msg)}</div></form></div>`;
  setTimeout(() => $('#lg-email')?.focus(), 30);
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'form-login') return;
  e.preventDefault();
  const btn = e.target.querySelector('button'), er = $('#lg-erro');
  btn.disabled = true; er.textContent = '';
  try {
    const j = await authFetch('token?grant_type=password', { email: $('#lg-email').value.trim(), password: $('#lg-senha').value });
    gravarSessao(sessaoDe(j));
    $('#login-root').innerHTML = '';
    await iniciarApp();
  } catch (err) { er.textContent = /invalid/i.test(err.message) ? 'E-mail ou senha incorretos.' : err.message; btn.disabled = false; }
});
function sairDaConta() {
  gravarSessao(null);
  try { for (const k of ['', ':v', ':pend']) localStorage.removeItem(LS_KEY + k); } catch (e) { /* sem armazenamento */ }
  location.reload();
}

async function iniciarApp() {
  carregar();
  await carregarNuvem();
  UI.view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'inicio';
  render();
  mlAuto();
  recalcPendencias();
}

/* ---------- início ---------- */
(async () => { if (await tokenValido()) await iniciarApp(); else mostrarLogin(); })();
